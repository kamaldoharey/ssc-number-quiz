<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Letter-Number Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background: linear-gradient(
          135deg,
          #1e3a8a,
          #7e22ce,
          #166534
        ); /* Deep blue -> Purple -> Green gradient */
        background-attachment: fixed; /* Fixes background during scroll */
        overflow-x: hidden; /* Prevents horizontal scroll */
      }

      #answerSheet {
        opacity: 0;
        transition:
          opacity 0.4s ease-in-out,
          transform 0.4s ease-in-out;
        margin-top: 20px;
        width: 100%;
        transform: translateY(10px);
        background: rgba(255, 255, 255, 0.1); /* Semi-transparent background */
        backdrop-filter: blur(10px); /* Glass effect */
        border-radius: 1rem;
        padding: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle border */
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); /* Outer glow */
      }

      #answerSheet:hover {
        opacity: 1;
        transform: translateY(0);
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
        box-sizing: border-box;
        gap: 2rem; /* Space between main elements */
      }

      @media (min-width: 768px) {
        .container {
          flex-direction: row;
          justify-content: center; /* Center both elements horizontally */
          align-items: flex-start;
          padding: 3rem; /* More padding on larger screens */
        }
        #answerSheet {
          width: 40%; /* Adjust width for side-by-side layout */
          margin-top: 0;
          margin-left: 2rem; /* Space between quiz and sheet */
        }
        .quiz-container {
          width: 45%; /* Adjust width for side-by-side layout */
        }
      }

      .quiz-container {
        background: rgba(255, 255, 255, 0.15); /* Semi-transparent white */
        backdrop-filter: blur(12px); /* Glass effect */
        border-radius: 1.5rem;
        box-shadow:
          0 10px 30px -10px rgba(0, 0, 0, 0.3),
          0 4px 10px -5px rgba(0, 0, 0, 0.1);
        padding: 2.5rem;
        width: 100%;
        max-width: 36rem;
        transition:
          transform 0.3s ease-in-out,
          box-shadow 0.3s ease-in-out;
        margin-bottom: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.2); /* Subtle border */
      }

      .quiz-container:hover {
        transform: translateY(-5px); /* Lift slightly on hover */
        box-shadow:
          0 15px 40px -10px rgba(0, 0, 0, 0.4),
          0 6px 15px -5px rgba(0, 0, 0, 0.2);
      }

      .input-group {
        margin-bottom: 2rem;
      }

      .input-group label {
        display: block;
        color: #e2e8f0; /* Light gray text */
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 0.75rem;
        transition: color 0.3s ease-in-out;
      }

      .input-group label:focus-within {
        color: #f8fafc; /* Slightly lighter on focus */
      }

      .quiz-container p {
        color: #f0f9ff; /* Very light blue/cyan text */
        font-size: 1.5rem; /* Slightly smaller */
        font-weight: 700;
        margin-bottom: 1.5rem;
        text-align: center;
        letter-spacing: 0.05rem;
        font-family:
          "JetBrains Mono", monospace; /* Monospace for letter display */
      }

      input[type="text"] {
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        width: 100%;
        padding: 0.9rem 1.2rem; /* Increased padding */
        border-radius: 0.75rem; /* Slightly rounder corners */
        border: 2px solid rgba(255, 255, 255, 0.3); /* Lighter border */
        outline: none;
        font-size: 1.1rem;
        color: #f1f5f9; /* Light text inside input */
        background: rgba(0, 0, 0, 0.2); /* Darker input background */
        transition:
          border-color 0.3s ease-in-out,
          box-shadow 0.3s ease-in-out,
          background-color 0.3s ease-in-out;
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.2); /* Inner shadow */
      }

      input[type="text"]:focus {
        border-color: #818cf8; /* Focus border color */
        box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.2); /* Focus glow */
        background: rgba(0, 0, 0, 0.25); /* Slightly darker on focus */
      }

      input[type="text"]::placeholder {
        color: #94a3b8; /* Muted placeholder */
        font-weight: 400;
      }

      .warning-message {
        color: #fca5a5; /* Light red text */
        font-size: 0.95rem; /* Slightly larger */
        font-style: normal; /* Normal font style */
        margin-top: 1rem;
        padding: 0.8rem 1rem; /* Adjusted padding */
        background: rgba(239, 68, 68, 0.15); /* Reddish background */
        border-radius: 0.5rem;
        border: 1px solid rgba(239, 68, 68, 0.3); /* Reddish border */
        animation: fadeIn 0.3s ease-in-out;
        backdrop-filter: blur(5px); /* Slight blur inside warning */
        text-align: center; /* Center text */
      }

      .warning-message.bg-green-100 {
        background: rgba(34, 197, 94, 0.15); /* Greenish background */
        border-color: rgba(34, 197, 94, 0.3); /* Greenish border */
        color: #a7f3d0; /* Light green text */
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .check-button {
        padding: 1rem 2.2rem;
        border-radius: 0.75rem;
        background: linear-gradient(
          135deg,
          #4f46e5,
          #7c3aed
        ); /* Indigo to violet gradient */
        color: white;
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        border: none;
        outline: none;
        box-shadow:
          0 6px 12px -3px rgba(0, 0, 0, 0.25),
          0 3px 8px -2px rgba(0, 0, 0, 0.15);
        transition:
          transform 0.2s ease-in-out,
          box-shadow 0.2s ease-in-out,
          background 0.3s ease-in-out;
        font-family: "Inter", sans-serif;
      }

      .check-button:hover {
        transform: translateY(-2px);
        box-shadow:
          0 8px 15px -3px rgba(0, 0, 0, 0.3),
          0 4px 10px -2px rgba(0, 0, 0, 0.2);
        background: linear-gradient(
          135deg,
          #4338ca,
          #6d28d9
        ); /* Darker gradient on hover */
      }

      .check-button:active {
        transform: translateY(1px);
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        background: linear-gradient(
          135deg,
          #3730a3,
          #5b21b6
        ); /* Even darker on active */
      }

      .toggle-container {
        display: flex;
        align-items: center;
        margin-bottom: 1.5rem; /* Reduced margin */
        justify-content: center; /* Center toggle */
      }

      .toggle-label {
        margin-right: 1rem;
        color: #cbd5e1; /* Light gray text */
        font-size: 1.1rem;
        font-weight: 600;
        white-space: nowrap; /* Prevent label wrapping */
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 64px; /* Slightly wider */
        height: 34px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(148, 163, 184, 0.4); /* Muted background */
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 34px;
        border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle border */
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: 0.4s;
        transition: 0.4s;
        border-radius: 50%;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); /* Shadow for handle */
      }

      input:checked + .slider {
        background: rgba(
          99,
          102,
          241,
          0.6
        ); /* Indigo background when checked */
      }

      input:focus + .slider {
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3); /* Focus ring */
      }

      input:checked + .slider:before {
        -webkit-transform: translateX(30px); /* Adjust for wider switch */
        -ms-transform: translateX(30px);
        transform: translateX(30px);
      }

      table.answer-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        background: transparent; /* Transparent table background */
      }

      table.answer-table th,
      table.answer-table td {
        padding: 0.5rem;
        text-align: center;
        color: #e2e8f0; /* Light text */
        border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle cell borders */
      }

      table.answer-table th {
        background: rgba(0, 0, 0, 0.2); /* Darker header background */
        font-weight: 600;
      }

      table.answer-table tr:nth-child(even) {
        background: rgba(255, 255, 255, 0.05); /* Alternating row color */
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-blue-900 via-purple-900 to-emerald-900">
    <div class="container">
      <div class="quiz-container">
        <h1
          class="text-3xl font-bold text-white mb-6 text-center bg-clip-text text-transparent bg-gradient-to-r from-blue-300 to-purple-300"
        >
          Modern Letter-Number Quiz
        </h1>

        <div class="toggle-container">
          <label class="toggle-label">Enable 5s Timer</label>
          <label class="toggle-switch">
            <input type="checkbox" id="timerToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="input-group">
          <label for="letterInput"
            >What number corresponds to this letter?</label
          >
          <p
            id="questionLetter"
            class="text-7xl md:text-8xl font-bold uppercase text-cyan-100 text-center mt-2 tracking-wider font-mono"
          ></p>
          <input
            type="text"
            id="letterInput"
            placeholder="Enter number (1-26)..."
            class="w-full mt-4 bg-gray-800 text-white border-gray-600 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-300"
          />
        </div>

        <p id="warning" class="warning-message" style="display: none"></p>

        <div class="flex items-center justify-center mt-4">
          <button id="checkButton" class="check-button">Submit Answer</button>
        </div>
      </div>

      <div id="answerSheet" class="text-center">
        <h3 class="text-xl font-semibold text-white mb-4">
          Answer Sheet (Hover to Reveal)
        </h3>
        <table class="answer-table">
          <thead>
            <tr>
              <th>Letter</th>
              <th>Number</th>
              <th>Letter</th>
              <th>Number</th>
            </tr>
          </thead>
          <tbody>
            <!-- Rows remain the same -->
            <tr>
              <td>A</td>
              <td>1</td>
              <td>N</td>
              <td>14</td>
            </tr>
            <tr>
              <td>B</td>
              <td>2</td>
              <td>O</td>
              <td>15</td>
            </tr>
            <tr>
              <td>C</td>
              <td>3</td>
              <td>P</td>
              <td>16</td>
            </tr>
            <tr>
              <td>D</td>
              <td>4</td>
              <td>Q</td>
              <td>17</td>
            </tr>
            <tr>
              <td>E</td>
              <td>5</td>
              <td>R</td>
              <td>18</td>
            </tr>
            <tr>
              <td>F</td>
              <td>6</td>
              <td>S</td>
              <td>19</td>
            </tr>
            <tr>
              <td>G</td>
              <td>7</td>
              <td>T</td>
              <td>20</td>
            </tr>
            <tr>
              <td>H</td>
              <td>8</td>
              <td>U</td>
              <td>21</td>
            </tr>
            <tr>
              <td>I</td>
              <td>9</td>
              <td>V</td>
              <td>22</td>
            </tr>
            <tr>
              <td>J</td>
              <td>10</td>
              <td>W</td>
              <td>23</td>
            </tr>
            <tr>
              <td>K</td>
              <td>11</td>
              <td>X</td>
              <td>24</td>
            </tr>
            <tr>
              <td>L</td>
              <td>12</td>
              <td>Y</td>
              <td>25</td>
            </tr>
            <tr>
              <td>M</td>
              <td>13</td>
              <td>Z</td>
              <td>26</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <script>
      const letterInput = document.getElementById("letterInput");
      const warning = document.getElementById("warning");
      const checkButton = document.getElementById("checkButton");
      const questionLetterDisplay = document.getElementById("questionLetter");
      const timerToggle = document.getElementById("timerToggle");

      let currentLetter = "";
      let timerInterval;
      let timeLeft = 5;
      let timerEnabled = false;

      const letterToNumber = {
        a: 1,
        b: 2,
        c: 3,
        d: 4,
        e: 5,
        f: 6,
        g: 7,
        h: 8,
        i: 9,
        j: 10,
        k: 11,
        l: 12,
        m: 13,
        n: 14,
        o: 15,
        p: 16,
        q: 17,
        r: 18,
        s: 19,
        t: 20,
        u: 21,
        v: 22,
        w: 23,
        x: 24,
        y: 25,
        z: 26,
      };

      const letterHints = {
        a: "No specific hint available.",
        b: "No specific hint available.",
        c: "No specific hint available.",
        d: "No specific hint available.",
        e: "EJOTY. Rank of E is 5",
        f: "F for Fix and Six rhyme.",
        g: "G-7 Nations",
        h: "H looks like 8",
        i: "Cursive I resembles 9",
        j: "EJOTY. J is rank 10",
        k: "K comes after J → 11",
        l: "Sounds like Twelve",
        m: "Middle of alphabet = 13",
        n: "Children's Day on Nov 14",
        o: "EJOTY. O is rank 15",
        p: "Reverse P looks like 6 → 16",
        q: "Queen at 17 pe Khatra",
        r: "Raja follows Queen → 18",
        s: "UNISSSS = 19",
        t: "T-20 Cricket Match",
        u: "Graduation at age 21",
        v: "V for Victory = 2 fingers = 22",
        w: "Rotate W 90° = M is 13, W is 23",
        x: "X has 4 parts = 24",
        y: "EJOTY. Y = 25",
        z: "Last letter = 26",
      };

      function getRandomLetter() {
        const letters = Object.keys(letterToNumber);
        return letters[Math.floor(Math.random() * letters.length)];
      }

      function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 5;
        timerInterval = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
          } else {
            clearInterval(timerInterval);
            const expected = letterToNumber[currentLetter];
            const hint = letterHints[currentLetter];
            warning.textContent = `⏰ Time Up! ${currentLetter.toUpperCase()} = ${expected}. Hint: ${hint}`;
            warning.classList.remove("bg-red-100");
            warning.classList.add("bg-green-100"); // Using green style for time up too
            warning.style.display = "block";
            letterInput.value = "";
            setTimeout(nextQuestion, 2000); // Move to next question after delay
          }
        }, 1000);
      }

      function nextQuestion() {
        clearInterval(timerInterval); // Clear existing timer if any
        currentLetter = getRandomLetter();
        questionLetterDisplay.textContent = currentLetter.toUpperCase();
        warning.style.display = "none"; // Hide warning on new question
        if (timerEnabled) startTimer();
      }

      function checkAnswer() {
        const userInput = parseInt(letterInput.value.trim(), 10);

        if (!userInput || isNaN(userInput) || userInput < 1 || userInput > 26) {
          warning.textContent =
            "❌ Please enter a valid number between 1 and 26.";
          warning.classList.remove("bg-green-100");
          warning.classList.add("bg-red-100");
          warning.style.display = "block";
          letterInput.value = "";
          return;
        }

        const expected = letterToNumber[currentLetter];
        if (userInput === expected) {
          // Prepare the correct message but don't show it visibly
          warning.textContent = "✅ Correct!";
          warning.classList.remove("bg-red-100");
          warning.classList.add("bg-green-100");
          warning.style.display = "none"; // Hide the feedback instantly
          letterInput.value = "";

          // Move to next question after a short delay
          setTimeout(() => {
            warning.style.display = "none"; // Ensure it stays hidden
            nextQuestion();
          }, 100); // Very short delay for smooth transition
        } else {
          const hint = letterHints[currentLetter];
          warning.textContent = `❌ Wrong! ${currentLetter.toUpperCase()} = ${expected}. Hint: ${hint}`;
          warning.classList.remove("bg-green-100");
          warning.classList.add("bg-red-100");
          warning.style.display = "block";
          letterInput.value = "";
          setTimeout(() => {
            warning.style.display = "none"; // Clear feedback after delay
            nextQuestion();
          }, 2500); // Delay before next question on wrong answer
        }
      }

      // Event Listeners
      checkButton.addEventListener("click", checkAnswer);
      letterInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") checkAnswer();
      });

      timerToggle.addEventListener("change", () => {
        timerEnabled = timerToggle.checked;
        if (timerEnabled && document.querySelector(".quiz-container")) {
          startTimer(); // Start immediately if enabled
        } else {
          clearInterval(timerInterval); // Stop if disabled
        }
      });

      // Initialize
      nextQuestion();
    </script>
  </body>
</html>
